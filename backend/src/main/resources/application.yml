spring:
  application:
    name: partners-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/supplybase_partners?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_0900_ai_ci&serverTimezone=UTC}
    username: ${DB_USERNAME:supplybase}
    password: ${DB_PASSWORD:supplybase}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION
    timeout: 12h

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: SB_SESSION
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: ${COOKIE_SAME_SITE:lax}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

supplybase:
  business-timezone: Asia/Kolkata
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  otp:
    length: 6
    ttl-seconds: 300
    resend-cooldown-seconds: 30
    max-attempts: 5
    max-requests-per-phone-per-hour: 8
  storage:
    root-dir: ${STORAGE_ROOT_DIR:./data/storage}
  webhooks:
    shared-secret: ${WEBHOOKS_SHARED_SECRET:dev-local-webhook-secret-change-me}
  admin-bootstrap:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:true}
    username: ${ADMIN_BOOTSTRAP_USERNAME:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    phone: ${ADMIN_BOOTSTRAP_PHONE:+910000000000}
  providers:
    sms:
      mode: ${SMS_PROVIDER_MODE:dev_local}
    identity-verification:
      mode: ${IDENTITY_PROVIDER_MODE:manual_review}
    kit-payments:
      mode: ${KIT_PAYMENTS_MODE:dev_simulator}
    payouts:
      mode: ${PAYOUTS_MODE:dev_simulator}
