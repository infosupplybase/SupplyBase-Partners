name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build + Testcontainers tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # GitHub-hosted ubuntu-latest runners ship Docker preinstalled and
      # already running, which is exactly what Testcontainers needs to spin
      # up the real MySQL instance the integration tests (screening-capacity
      # race, job-acceptance race, kit-order idempotency, OTP flow) run
      # against -- this is the first place those tests actually execute,
      # since the local build environment had no Docker engine available.
      - name: Build and test
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload surefire/failsafe reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/

  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
