server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the Spring Boot backend inside the compose network.
    # The session cookie and CSRF cookie both work here because the browser
    # sees a single origin (this nginx) for both the SPA and /api.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    location /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
    }

    # SPA deep-link fallback: any non-file, non-/api route serves index.html
    # so React Router can handle client-side routes like /onboarding/city.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
}
